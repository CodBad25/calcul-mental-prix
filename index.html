<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Mental — Prix (6e)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            color: #222;
            line-height: 1.4;
            background: #f5f5f5;
        }

        .container {
            max-width: 210mm;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            background: white;
            box-sizing: border-box;
        }

        /* ============ NAVIGATION ============ */
        .nav-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 3px solid #1e40af;
            padding-bottom: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            background: #e0e7ff;
            color: #1e40af;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #1e40af;
            color: white;
        }

        .nav-btn:hover {
            background: #1e40af;
            color: white;
        }

        .mode-section {
            display: none;
        }

        .mode-section.active {
            display: block;
        }

        /* ============ PRINT MODE ============ */
        .print-section {
            /* print styles below */
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 3px solid #1e40af;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            color: #1e40af;
            margin-bottom: 15px;
        }

        .header-fields {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            font-size: 12px;
        }

        .header-field {
            display: flex;
            flex-direction: column;
        }

        .header-field label {
            font-weight: 600;
            color: #1e40af;
            margin-bottom: 4px;
        }

        .header-field input {
            border: none;
            border-bottom: 1px solid #999;
            padding: 4px 0;
            font-size: 12px;
            font-family: inherit;
        }

        .series {
            page-break-inside: avoid;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .series-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 8px;
        }

        .series-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e40af;
        }

        .series-timer {
            font-size: 11px;
            color: #666;
            font-style: italic;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }

        .question {
            background: white;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .question-text {
            flex: 1;
            line-height: 1.3;
        }

        .answer-box {
            width: 45px;
            height: 22px;
            border: 1px solid #999;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-size: 10px;
            flex-shrink: 0;
        }

        .series-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
        }

        .score-box {
            border: 1px solid #999;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 600;
        }

        .teacher-section {
            page-break-before: always;
            margin-top: 40px;
        }

        .teacher-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 20px;
            border-bottom: 3px solid #1e40af;
            padding-bottom: 10px;
        }

        .objectives {
            background: #e0e7ff;
            padding: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #1e40af;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.5;
        }

        .objectives h3 {
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 8px;
        }

        .advice-section {
            background: #fef3c7;
            padding: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #d97706;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.5;
        }

        .advice-section h3 {
            font-size: 13px;
            color: #b45309;
            margin-bottom: 8px;
        }

        .advice-section ul {
            margin-left: 20px;
        }

        .advice-section li {
            margin-bottom: 4px;
        }

        .strategies-section {
            background: #dcfce7;
            padding: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #16a34a;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.5;
        }

        .strategies-section h3 {
            font-size: 13px;
            color: #15803d;
            margin-bottom: 8px;
        }

        .strategies-section ul {
            margin-left: 20px;
        }

        .strategies-section li {
            margin-bottom: 4px;
        }

        .answers-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-top: 15px;
        }

        .answers-table thead {
            background: #1e40af;
            color: white;
            font-weight: 600;
        }

        .answers-table th {
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #999;
            font-size: 11px;
        }

        .answers-table td {
            padding: 6px 4px;
            text-align: center;
            border: 1px solid #ddd;
            height: 24px;
        }

        .answers-table tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        .question-number {
            display: inline-block;
            background: #1e40af;
            color: white;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            margin-right: 6px;
            vertical-align: middle;
            min-width: 18px;
            text-align: center;
        }

        /* ============ INTERACTIVE MODE ============ */
        .student-name-form {
            background: #e0e7ff;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
            text-align: center;
        }

        .student-name-form h2 {
            font-size: 18px;
            color: #1e40af;
            margin-bottom: 15px;
        }

        .student-name-form input {
            padding: 10px 15px;
            border: 2px solid #1e40af;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
            margin-right: 10px;
        }

        .student-name-form button {
            padding: 10px 25px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .student-name-form button:hover {
            background: #1e3a8a;
        }

        .series-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .series-card {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
        }

        .series-card:hover {
            border-color: #1e40af;
            background: #e0e7ff;
        }

        .series-card.active {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .series-card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .series-card-score {
            font-size: 12px;
            opacity: 0.7;
        }

        .interactive-quiz {
            margin-bottom: 30px;
        }

        .timer-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 4px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: 700;
            color: #1e40af;
            font-family: 'Courier New', monospace;
        }

        .timer-display.warning {
            color: #d97706;
        }

        .timer-display.critical {
            color: #dc2626;
        }

        .question-count {
            font-size: 14px;
            color: #666;
        }

        .quiz-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-option-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .quiz-option-btn.active {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .quiz-option-btn:hover {
            border-color: #1e40af;
        }

        .quiz-questions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .quiz-question {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-question.full-width {
            grid-column: 1 / -1;
        }

        .quiz-q-text {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .quiz-q-input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .quiz-q-input:focus {
            outline: none;
            border-color: #1e40af;
        }

        .submit-btn {
            padding: 12px 30px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            align-self: center;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: #15803d;
        }

        .submit-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .results-section {
            background: #e0e7ff;
            padding: 30px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 30px;
        }

        .results-score {
            font-size: 48px;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 10px;
        }

        .results-message {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #10b981);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .correction-section {
            margin-bottom: 30px;
        }

        .correction-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-left: 4px solid #ddd;
            border-radius: 3px;
        }

        .correction-item.correct {
            border-left-color: #16a34a;
            background: #f0fdf4;
        }

        .correction-item.incorrect {
            border-left-color: #dc2626;
            background: #fef2f2;
        }

        .correction-q {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .correction-detail {
            font-size: 12px;
            color: #666;
        }

        .student-profile {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
        }

        .student-profile h3 {
            color: #1e40af;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #1e40af;
        }

        .series-progress {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .series-progress-card {
            background: white;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            border: 2px solid #ddd;
        }

        .series-progress-card.red {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .series-progress-card.orange {
            border-color: #d97706;
            background: #fef3c7;
        }

        .series-progress-card.green {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .series-progress-label {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .series-progress-score {
            font-size: 16px;
            font-weight: 700;
        }

        /* ============ TEACHER DASHBOARD ============ */
        .teacher-login {
            background: #fef3c7;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
            text-align: center;
        }

        .teacher-login input {
            padding: 10px 15px;
            border: 2px solid #d97706;
            border-radius: 4px;
            font-size: 14px;
            width: 200px;
            margin-right: 10px;
        }

        .teacher-login button {
            padding: 10px 25px;
            background: #d97706;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .teacher-login button:hover {
            background: #b45309;
        }

        .dashboard-content {
            display: none;
        }

        .dashboard-content.active {
            display: block;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .students-table thead {
            background: #1e40af;
            color: white;
            font-weight: 600;
        }

        .students-table th {
            padding: 10px;
            text-align: left;
            border: 1px solid #999;
        }

        .students-table td {
            padding: 8px 10px;
            border: 1px solid #ddd;
        }

        .students-table tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        .score-cell {
            font-weight: 600;
            text-align: center;
        }

        .score-cell.red {
            color: #dc2626;
            background: #fef2f2;
        }

        .score-cell.orange {
            color: #d97706;
            background: #fef3c7;
        }

        .score-cell.green {
            color: #16a34a;
            background: #f0fdf4;
        }

        /* ============ PRINT STYLES ============ */
        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
                font-size: 11px;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
                background: white;
            }

            .nav-bar, .print-controls, .student-name-form, .series-selector,
            .interactive-quiz, .student-profile, .teacher-login,
            .dashboard-content, #interactive-mode, #teacher-mode {
                display: none !important;
            }

            .mode-section.print-section {
                display: block !important;
            }

            .header {
                margin-bottom: 15px;
                padding-bottom: 10px;
            }

            .header h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .series {
                page-break-inside: avoid;
                margin-bottom: 15px;
                padding: 8px;
                border: 1px solid #ccc;
                background: #fafafa;
            }

            .questions-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .question {
                font-size: 10px;
                padding: 5px;
            }

            .answer-box {
                width: 40px;
                height: 20px;
                border: 1px solid #666;
            }

            .question-number {
                font-size: 8px;
                padding: 1px 4px;
            }

            .teacher-section {
                page-break-before: always;
            }

            .header-field input {
                border: none;
                border-bottom: 1px solid #000;
            }

            @page {
                size: A4;
                margin: 8mm;
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            html {
                overflow-x: hidden;
            }

            body {
                overflow-x: hidden;
                max-width: 100vw;
            }

            .container {
                max-width: 100vw;
                width: 100%;
                padding: 8px;
            }

            .nav-bar {
                gap: 3px;
                margin-bottom: 10px;
                padding-bottom: 8px;
            }

            .nav-btn {
                flex: 1;
                padding: 8px 2px;
                font-size: 10px;
                min-width: 0;
            }

            .print-controls {
                padding: 8px;
            }

            .controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }

            .controls-label {
                text-align: center;
                font-size: 12px;
            }

            .series-chips {
                justify-content: center;
            }

            .series-chip {
                padding: 3px 8px;
                font-size: 11px;
            }

            .controls-actions {
                width: 100%;
            }

            .controls-actions .print-btn {
                flex: 1;
                text-align: center;
                font-size: 10px;
                padding: 8px 4px;
                min-width: 0;
            }

            .series {
                padding: 8px;
                margin-bottom: 12px;
            }

            .series-header {
                flex-direction: column;
                gap: 2px;
            }

            .questions-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
            }

            .question {
                font-size: 9px;
                padding: 5px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .answer-box {
                width: 100%;
                height: 18px;
            }

            .series-selector {
                grid-template-columns: repeat(2, 1fr);
            }

            .quiz-questions {
                grid-template-columns: 1fr;
            }

            .timer-section {
                padding: 10px;
            }

            .timer-display {
                font-size: 32px;
            }

            .profile-stats {
                grid-template-columns: 1fr;
            }

            .student-name-form input {
                width: 100%;
                font-size: 14px;
                margin-bottom: 10px;
                margin-right: 0;
            }

            .student-name-form button {
                width: 100%;
            }

            .teacher-section {
                overflow-x: auto;
            }

            .answers-table {
                font-size: 9px;
            }
        }

        .print-controls {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c7d2fe;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .controls-label {
            font-size: 13px;
            font-weight: 700;
            color: #1e40af;
            white-space: nowrap;
        }

        .controls-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .print-btn {
            padding: 8px 16px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .print-btn.secondary {
            background: white;
            color: #1e40af;
            border: 2px solid #1e40af;
        }

        .print-btn:hover {
            opacity: 0.85;
        }

        .series-chips {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .series-chip {
            padding: 4px 12px;
            border: 2px solid #c7d2fe;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.15s;
            color: #666;
        }

        .series-chip.active {
            background: #1e40af;
            color: white;
            border-color: #1e40af;
        }

        .series-chip:hover {
            border-color: #1e40af;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <div class="container">
        <!-- NAVIGATION -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchMode('print')">Fiche imprimable</button>
            <button class="nav-btn" onclick="switchMode('interactive')">S'entraîner</button>
            <button class="nav-btn" onclick="switchMode('teacher')">Suivi enseignant</button>
        </div>

        <!-- ============ PRINT MODE ============ -->
        <div id="print-mode" class="mode-section active print-section">
            <div class="print-controls">
                <div class="controls-row">
                    <div class="controls-label">Séries :</div>
                    <div class="series-chips" id="seriesChips">
                        <button class="series-chip active" data-series="all" onclick="toggleSeriesChip(this)">Toutes</button>
                        <button class="series-chip active" data-series="1" onclick="toggleSeriesChip(this)">S1</button>
                        <button class="series-chip active" data-series="2" onclick="toggleSeriesChip(this)">S2</button>
                        <button class="series-chip active" data-series="3" onclick="toggleSeriesChip(this)">S3</button>
                        <button class="series-chip active" data-series="4" onclick="toggleSeriesChip(this)">S4</button>
                        <button class="series-chip active" data-series="5" onclick="toggleSeriesChip(this)">S5</button>

            <!-- SECTION ENSEIGNANT AVEC RÉPONSES -->

        <!-- ============ INTERACTIVE MODE ============ -->
        <div id="interactive-mode" class="mode-section">
            <div class="student-name-form">
                <h2>Bienvenue au calcul mental !</h2>
                <input type="text" id="studentName" placeholder="Entre ton prénom">

            <div id="interactive-content" style="display: none;">

                    <div class="profile-stats">

                        <div class="stat-card">
                            <div class="stat-label">Meilleur score</div>
                            <div class="stat-value" id="bestScoreOverall">0/15</div>

                    <div>
                        <h4 style="color: #1e40af; margin-bottom: 10px;">Tes meilleures notes par série :</h4>

                    <div class="quiz-options">

                        <button class="quiz-option-btn" onclick="setDisplayMode('one')">Une question à la fois</button>

                    <div class="quiz-questions" id="quizQuestions"></div>

                    <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">Terminé</button>

                <div id="results-area" style="display: none;">
                    <div class="results-section">
                        <div class="results-score" id="finalScore">15/15</div>
                        <div class="results-message" id="resultMessage"></div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width: 100%;">100%</div>
                        </div>

                    <div class="correction-section" id="correctionSection"></div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button class="submit-btn" onclick="restartQuiz()" style="background: #1e40af; margin-right: 10px;">Recommencer</button>
                        <button class="submit-btn" onclick="changeSeries()" style="background: #666;">Changer de série</button>

        <!-- ============ TEACHER DASHBOARD ============ -->
        <div id="teacher-mode" class="mode-section">
            <div id="dashboard-content" class="dashboard-content" style="display: block;">
                <h2 style="color: #1e40af; margin-bottom: 20px;">Suivi de classe</h2>

                <div style="margin-bottom: 20px;">
                    <button class="submit-btn" style="background: #1e40af; margin-right: 10px;" onclick="exportCSV()">Exporter en CSV</button>
                </div>

                <table class="students-table" id="dashboardTable">
                    <thead>
                        <tr>
                            <th>Élève</th>
                            <th>Série 1</th>
                            <th>Série 2</th>
                            <th>Série 3</th>
                            <th>Série 4</th>
                            <th>Série 5</th>
                            <th>Série 6</th>
                            <th>Série 7</th>
                            <th>Série 8</th>
                            <th>Tentatives</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardBody">
                    </tbody>
                </table>

        </div>

    </div>

    <script>
        // ============ CONFIGURATION ============
        const ITEMS = [
            { sing: 'croissant', plur: 'croissants', art: 'un' },
            { sing: 'baguette', plur: 'baguettes', art: 'une' },
            { sing: 'stylo', plur: 'stylos', art: 'un' },
            { sing: 'gomme', plur: 'gommes', art: 'une' },
            { sing: 'cahier', plur: 'cahiers', art: 'un' },
            { sing: 'livre', plur: 'livres', art: 'un' },
            { sing: 'sandwich', plur: 'sandwichs', art: 'un' },
            { sing: 'pizza', plur: 'pizzas', art: 'une' },
            { sing: 'muffin', plur: 'muffins', art: 'un' },
            { sing: 'crayon', plur: 'crayons', art: 'un' },
            { sing: 'place de cinéma', plur: 'places de cinéma', art: 'une' },
            { sing: 'bouteille d\'eau', plur: 'bouteilles d\'eau', art: 'une' },
            { sing: 'pain au chocolat', plur: 'pains au chocolat', art: 'un' },
            { sing: 'ticket de bus', plur: 'tickets de bus', art: 'un' },
            { sing: 'timbre', plur: 'timbres', art: 'un' },
            { sing: 'classeur', plur: 'classeurs', art: 'un' },
        ];

        function pickItem() {
            return ITEMS[Math.floor(Math.random() * ITEMS.length)];
        }

        function pickItems(count) {
            const shuffled = [...ITEMS].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, count);
        }

        // ============ STATE ============
        let state = {
            currentStudent: '',
            currentSeries: null,
            currentQuestions: [],
            userAnswers: [],
            timerInterval: null,
            timeRemaining: 180,
            displayMode: 'all',
            correctAnswers: [],
            submitted: false
        };

        // ============ UTILITIES ============
        function switchMode(mode) {
            document.querySelectorAll('.mode-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(mode + '-mode').classList.add('active');
            event.target.classList.add('active');

            if (mode === 'interactive') {
                loadStudentProfile();
            }
            if (mode === 'teacher') {
                refreshDashboard();
            }
        }

        function roundToTwo(num) {
            return Math.round(num * 100) / 100;
        }

        function nicePrice(min, max, step) {
            const steps = Math.floor((max - min) / step);
            return roundToTwo(min + Math.floor(Math.random() * (steps + 1)) * step);
        }

        function fmtPrice(n) {
            if (n === Math.floor(n)) return n + '';
            return n.toFixed(2).replace('.', ',');
        }


        // ============ STORAGE ============
        function getStudentData(name) {
            const data = localStorage.getItem('mathprix_calcul_students');
            if (!data) return { attempts: [], bestScores: {} };
            const allData = JSON.parse(data);
            return allData[name] || { attempts: [], bestScores: {} };
        }

        function saveStudentData(name, data) {
            let allData = {};
            const existing = localStorage.getItem('mathprix_calcul_students');
            if (existing) allData = JSON.parse(existing);
            allData[name] = data;
            localStorage.setItem('mathprix_calcul_students', JSON.stringify(allData));
        }

        function getAllStudents() {
            const data = localStorage.getItem('mathprix_calcul_students');
            return data ? JSON.parse(data) : {};
        }

        // ============ INTERACTIVE MODE ============
        function startInteractive() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                alert('Veuillez entrer votre prénom');
                return;
            }
            state.currentStudent = name;
            document.getElementById('interactive-content').style.display = 'block';
            document.querySelector('.student-name-form').style.display = 'none';
            loadStudentProfile();
            renderSeriesSelector();
        }

        function loadStudentProfile() {
            if (!state.currentStudent) return;

            const studentData = getStudentData(state.currentStudent);
            document.getElementById('profileName').textContent = state.currentStudent;
            document.getElementById('totalAttempts').textContent = studentData.attempts.length;

            if (studentData.attempts.length > 0) {
                const bestAttempt = Math.max(...studentData.attempts.map(a => a.score));
                document.getElementById('bestScoreOverall').textContent = bestAttempt + '/15';
            }

            const progressHtml = Array.from({length: 8}, (_, i) => {
                const seriesNum = i + 1;
                const bestScore = studentData.bestScores[seriesNum] || null;
                let colorClass = 'red';
                if (bestScore !== null) {
                    if (bestScore >= 12) colorClass = 'green';
                    else if (bestScore >= 8) colorClass = 'orange';
                }
                return `
                    <div class="series-progress-card ${colorClass}">
                        <div class="series-progress-label">Série ${seriesNum}</div>
                        <div class="series-progress-score">${bestScore !== null ? bestScore : '-'}</div>
                    </div>
                `;
            }).join('');
            document.getElementById('seriesProgress').innerHTML = progressHtml;
        }

        function renderSeriesSelector() {
            const html = Array.from({length: 8}, (_, i) => {
                const seriesNum = i + 1;
                const studentData = getStudentData(state.currentStudent);
                const bestScore = studentData.bestScores[seriesNum];
                const scoreText = bestScore !== undefined ? `Meilleur: ${bestScore}/15` : 'Pas encore tentée';
                return `
                    <button class="series-card" onclick="selectSeries(${seriesNum})">
                        <div class="series-card-title">Série ${seriesNum}</div>
                        <div class="series-card-score">${scoreText}</div>
                    </button>
                `;
            }).join('');
            document.getElementById('seriesSelector').innerHTML = html;
        }

        function selectSeries(seriesNum) {
            state.currentSeries = seriesNum;
            state.currentQuestions = generateQuestions(seriesNum);
            state.userAnswers = new Array(15).fill('');
            state.submitted = false;
            state.timeRemaining = 180;

            document.getElementById('seriesSelector').style.display = 'none';
            document.getElementById('student-profile').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('results-area').style.display = 'none';

            renderQuizQuestions();
            document.getElementById('questionCount').textContent = `Série ${seriesNum} · 15 questions`;
            startTimer();
        }

        function generateQuestions(seriesNum) {
            const questions = [];

            if (seriesNum === 1) {
                // Rendre la monnaie — progressif
                for (let i = 0; i < 15; i++) {
                    let bill, payment;
                    if (i < 5) {
                        bill = [5, 10, 20][Math.floor(Math.random() * 3)];
                        payment = nicePrice(1, bill - 1, 0.50);
                    } else if (i < 10) {
                        bill = [10, 20, 50][Math.floor(Math.random() * 3)];
                        payment = nicePrice(1, bill - 0.5, 0.10);
                    } else {
                        bill = [20, 50, 100][Math.floor(Math.random() * 3)];
                        payment = nicePrice(1, bill - 0.5, 0.05);
                    }
                    const change = roundToTwo(bill - payment);
                    questions.push({
                        text: `On paie ${fmtPrice(payment)}€ avec ${bill}€. Combien rend-on ?`,
                        answer: fmtPrice(change) + '€'
                    });
                }

            } else if (seriesNum === 2) {
                // Additions de prix — progressif
                // Q1-5 : deux articles, prix en x,50 ou entiers
                for (let i = 0; i < 5; i++) {
                    const [a, b] = pickItems(2);
                    const p1 = nicePrice(0.50, 10, 0.50);
                    const p2 = nicePrice(0.50, 10, 0.50);
                    const total = roundToTwo(p1 + p2);
                    questions.push({
                        text: `${a.art.charAt(0).toUpperCase() + a.art.slice(1)} ${a.sing} à ${fmtPrice(p1)}€ et ${b.art} ${b.sing} à ${fmtPrice(p2)}€. Total ?`,
                        answer: fmtPrice(total) + '€'
                    });
                }
                // Q6-10 : quantité × prix ou deux articles en x,25
                for (let i = 0; i < 5; i++) {
                    if (i % 2 === 0) {
                        const item = pickItem();
                        const qty = Math.floor(Math.random() * 3) + 2;
                        const price = nicePrice(0.50, 8, 0.25);
                        const total = roundToTwo(qty * price);
                        questions.push({
                            text: `${qty} ${item.plur} à ${fmtPrice(price)}€. Total ?`,
                            answer: fmtPrice(total) + '€'
                        });
                    } else {
                        const [a, b] = pickItems(2);
                        const p1 = nicePrice(1, 15, 0.25);
                        const p2 = nicePrice(1, 12, 0.25);
                        const total = roundToTwo(p1 + p2);
                        questions.push({
                            text: `${a.art.charAt(0).toUpperCase() + a.art.slice(1)} ${a.sing} à ${fmtPrice(p1)}€ et ${b.art} ${b.sing} à ${fmtPrice(p2)}€. Total ?`,
                            answer: fmtPrice(total) + '€'
                        });
                    }
                }
                // Q11-15 : trois articles, multiples de 0,10
                for (let i = 0; i < 5; i++) {
                    const p1 = nicePrice(1, 12, 0.10);
                    const p2 = nicePrice(1, 12, 0.10);
                    const p3 = nicePrice(1, 8, 0.10);
                    const total = roundToTwo(p1 + p2 + p3);
                    questions.push({
                        text: `${fmtPrice(p1)}€ + ${fmtPrice(p2)}€ + ${fmtPrice(p3)}€. Total ?`,
                        answer: fmtPrice(total) + '€'
                    });
                }

            } else if (seriesNum === 3) {
                // Prix × quantité — progressif
                for (let i = 0; i < 15; i++) {
                    const item = pickItem();
                    let qty, price;
                    if (i < 5) {
                        qty = Math.floor(Math.random() * 5) + 2;
                        price = nicePrice(0.50, 5, 0.50);
                    } else if (i < 10) {
                        qty = Math.floor(Math.random() * 6) + 2;
                        price = nicePrice(0.25, 8, 0.25);
                    } else {
                        qty = Math.floor(Math.random() * 8) + 3;
                        price = nicePrice(0.10, 5, 0.10);
                    }
                    const total = roundToTwo(qty * price);
                    questions.push({
                        text: `${qty} ${item.plur} à ${fmtPrice(price)}€. Prix total ?`,
                        answer: fmtPrice(total) + '€'
                    });
                }

            } else if (seriesNum === 4) {
                // Partager l'addition — progressif
                for (let i = 0; i < 15; i++) {
                    const item = pickItem();
                    let divisor, unitPrice;
                    if (i < 5) {
                        divisor = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                        unitPrice = nicePrice(1, 10, 0.50);
                    } else if (i < 10) {
                        divisor = [2, 3, 4, 5, 6][Math.floor(Math.random() * 5)];
                        unitPrice = nicePrice(0.50, 8, 0.25);
                    } else {
                        divisor = [3, 4, 5, 6, 8][Math.floor(Math.random() * 5)];
                        unitPrice = nicePrice(0.50, 12, 0.25);
                    }
                    const total = roundToTwo(divisor * unitPrice);
                    questions.push({
                        text: `${fmtPrice(total)}€ pour ${divisor} ${item.plur}. Prix d'${item.art} ${item.sing} ?`,
                        answer: fmtPrice(unitPrice) + '€'
                    });
                }

            } else if (seriesNum === 5) {
                // Pourcentages — progressif
                for (let i = 0; i < 15; i++) {
                    let pct, amount;
                    if (i < 5) {
                        pct = [10, 50][Math.floor(Math.random() * 2)];
                    } else if (i < 10) {
                        pct = [10, 20, 25, 50][Math.floor(Math.random() * 4)];
                    } else {
                        pct = [10, 20, 25, 50, 75][Math.floor(Math.random() * 5)];
                    }
                    if (pct === 10) amount = (Math.floor(Math.random() * 19) + 1) * 10;
                    else if (pct === 20) amount = (Math.floor(Math.random() * 38) + 2) * 5;
                    else if (pct === 25) amount = (Math.floor(Math.random() * 47) + 3) * 4;
                    else if (pct === 50) amount = (Math.floor(Math.random() * 48) + 2) * 2;
                    else amount = (Math.floor(Math.random() * 47) + 3) * 4;
                    const result = roundToTwo(amount * pct / 100);
                    questions.push({
                        text: `${pct}% de ${amount}€. Montant ?`,
                        answer: fmtPrice(result) + '€'
                    });
                }

            } else if (seriesNum === 6) {
                // Prix à l'unité — progressif
                for (let i = 0; i < 15; i++) {
                    const unitOptions = [
                        { sing: 'kg', plur: 'kg' },
                        { sing: 'L', plur: 'L' },
                        { sing: 'pièce', plur: 'pièces' }
                    ];
                    const unit = unitOptions[Math.floor(Math.random() * unitOptions.length)];
                    let divisor, unitPrice;
                    if (i < 5) {
                        divisor = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                        unitPrice = nicePrice(1, 8, 0.50);
                    } else if (i < 10) {
                        divisor = [2, 3, 4, 5, 6][Math.floor(Math.random() * 5)];
                        unitPrice = nicePrice(0.50, 6, 0.25);
                    } else {
                        divisor = [3, 4, 5, 6, 8][Math.floor(Math.random() * 5)];
                        unitPrice = nicePrice(0.25, 5, 0.25);
                    }
                    const total = roundToTwo(divisor * unitPrice);
                    questions.push({
                        text: `${divisor} ${unit.plur} pour ${fmtPrice(total)}€. Prix par ${unit.sing} ?`,
                        answer: fmtPrice(unitPrice) + '€'
                    });
                }

            } else if (seriesNum === 7) {
                // Fractions de prix
                for (let i = 0; i < 15; i++) {
                    const allFracs = [
                        {num: 1, den: 2, text: 'La moitié de'},
                        {num: 1, den: 3, text: 'Le tiers de'},
                        {num: 2, den: 3, text: 'Les deux tiers de'},
                        {num: 1, den: 4, text: 'Le quart de'},
                        {num: 3, den: 4, text: 'Les trois quarts de'},
                        {num: 1, den: 5, text: 'Le cinquième de'}
                    ];
                    let fracs;
                    if (i < 5) fracs = allFracs.slice(0, 2);
                    else if (i < 10) fracs = allFracs.slice(0, 4);
                    else fracs = allFracs;
                    const frac = fracs[Math.floor(Math.random() * fracs.length)];
                    let amount = (Math.floor(Math.random() * 30) + 2) * frac.den;
                    const result = amount * frac.num / frac.den;
                    questions.push({
                        text: `${frac.text} ${amount}€. Montant ?`,
                        answer: fmtPrice(result) + '€'
                    });
                }

            } else if (seriesNum === 8) {
                // Mix final — un de chaque type
                const types = [
                    () => {
                        const a = nicePrice(1, 50, 0.50);
                        const b = nicePrice(1, 50, 0.50);
                        return { text: `${fmtPrice(a)}€ + ${fmtPrice(b)}€ = ?`, answer: fmtPrice(roundToTwo(a + b)) + '€' };
                    },
                    () => {
                        const bill = [10, 20, 50][Math.floor(Math.random() * 3)];
                        const payment = nicePrice(1, bill - 1, 0.10);
                        return { text: `Monnaie sur ${bill}€ si on paie ${fmtPrice(payment)}€ ?`, answer: fmtPrice(roundToTwo(bill - payment)) + '€' };
                    },
                    () => {
                        const qty = Math.floor(Math.random() * 8) + 2;
                        const price = nicePrice(0.50, 8, 0.25);
                        return { text: `${qty} × ${fmtPrice(price)}€ = ?`, answer: fmtPrice(roundToTwo(qty * price)) + '€' };
                    },
                    () => {
                        const pct = [10, 25, 50][Math.floor(Math.random() * 3)];
                        let amount;
                        if (pct === 10) amount = (Math.floor(Math.random() * 19) + 1) * 10;
                        else if (pct === 25) amount = (Math.floor(Math.random() * 24) + 1) * 4;
                        else amount = (Math.floor(Math.random() * 48) + 2) * 2;
                        return { text: `${pct}% de ${amount}€ = ?`, answer: fmtPrice(roundToTwo(amount * pct / 100)) + '€' };
                    },
                    () => {
                        const divisor = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                        const unitPrice = nicePrice(1, 10, 0.50);
                        return { text: `${fmtPrice(roundToTwo(divisor * unitPrice))}€ ÷ ${divisor} = ?`, answer: fmtPrice(unitPrice) + '€' };
                    },
                    () => {
                        const fracs = [
                            {num: 1, den: 2, text: 'La moitié de'},
                            {num: 1, den: 4, text: 'Le quart de'},
                            {num: 2, den: 3, text: 'Les deux tiers de'}
                        ];
                        const frac = fracs[Math.floor(Math.random() * fracs.length)];
                        const amount = (Math.floor(Math.random() * 30) + 2) * frac.den;
                        return { text: `${frac.text} ${amount}€ = ?`, answer: fmtPrice(amount * frac.num / frac.den) + '€' };
                    }
                ];
                for (let i = 0; i < 15; i++) {
                    questions.push(types[i % types.length]());
                }
            }

            return questions;
        }

        function renderQuizQuestions() {
            const container = document.getElementById('quizQuestions');
            const displayOne = state.displayMode === 'one';

            const html = state.currentQuestions.map((q, idx) => {
                const classes = displayOne ? 'quiz-question' : 'quiz-question';
                const display = displayOne && idx !== 0 ? 'none' : 'flex';
                return `
                    <div class="${classes}" style="display: ${display}" data-idx="${idx}">
                        <div class="quiz-q-text">${idx + 1}. ${q.text}</div>
                        <input class="quiz-q-input" type="text" data-idx="${idx}" value="${state.userAnswers[idx]}"
                            onchange="state.userAnswers[${idx}] = this.value">
                    </div>
                `;
            }).join('');
            container.innerHTML = html;
        }

        function setDisplayMode(mode) {
            state.displayMode = mode;
            document.querySelectorAll('.quiz-option-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderQuizQuestions();
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.timeRemaining = 180;

            state.timerInterval = setInterval(() => {
                state.timeRemaining--;
                updateTimerDisplay();

                if (state.timeRemaining <= 0) {
                    clearInterval(state.timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(state.timeRemaining / 60);
            const secs = state.timeRemaining % 60;
            const display = `${mins}:${secs.toString().padStart(2, '0')}`;

            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = display;

            if (state.timeRemaining < 30) {
                timerEl.classList.add('critical');
                timerEl.classList.remove('warning');
            } else if (state.timeRemaining < 60) {
                timerEl.classList.add('warning');
                timerEl.classList.remove('critical');
            } else {
                timerEl.classList.remove('warning', 'critical');
            }
        }

        function submitQuiz() {
            clearInterval(state.timerInterval);
            state.submitted = true;

            state.correctAnswers = state.currentQuestions.map(q => q.answer);

            let score = 0;
            state.userAnswers.forEach((answer, idx) => {
                const correct = normalizeAnswer(state.correctAnswers[idx]);
                const userAnswer = normalizeAnswer(answer);
                if (correct === userAnswer) score++;
            });

            const studentData = getStudentData(state.currentStudent);
            const seriesNum = state.currentSeries;

            if (!studentData.bestScores[seriesNum] || score > studentData.bestScores[seriesNum]) {
                studentData.bestScores[seriesNum] = score;
            }

            studentData.attempts.push({
                date: new Date().toISOString().split('T')[0],
                series: seriesNum,
                score: score,
                total: 15,
                time: getTimeString()
            });

            saveStudentData(state.currentStudent, studentData);

            showResults(score);
            loadStudentProfile();
        }

        function normalizeAnswer(answer) {
            return answer.toLowerCase().replace(/\s/g, '').replace('€', '').replace(',', '.');
        }

        function getTimeString() {
            const elapsed = 180 - state.timeRemaining;
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function showResults(score) {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('results-area').style.display = 'block';

            const percent = Math.round(score / 15 * 100);
            document.getElementById('finalScore').textContent = `${score}/15`;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressFill').textContent = percent + '%';

            let message = '';
            if (score === 15) message = 'Parfait ! Excellente performance !';
            else if (score >= 12) message = 'Très bien ! Bravo !';
            else if (score >= 8) message = 'Bien ! Continue tes efforts.';
            else if (score >= 5) message = 'À retravailler. Persévère !';
            else message = 'Continue ton entraînement !';

            document.getElementById('resultMessage').textContent = message;

            const correctionHtml = state.currentQuestions.map((q, idx) => {
                const correct = normalizeAnswer(state.correctAnswers[idx]);
                const userAnswer = normalizeAnswer(state.userAnswers[idx]);
                const isCorrect = correct === userAnswer;
                const className = isCorrect ? 'correct' : 'incorrect';

                return `
                    <div class="correction-item ${className}">
                        <div class="correction-q">${idx + 1}. ${q.text}</div>
                        <div class="correction-detail">
                            Réponse: <strong>${state.correctAnswers[idx]}</strong>
                            ${!isCorrect ? ` · Tu as répondu: <strong>${state.userAnswers[idx] || '-'}</strong>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('correctionSection').innerHTML = correctionHtml;
        }

        function restartQuiz() {
            state.currentQuestions = generateQuestions(state.currentSeries);
            state.userAnswers = new Array(15).fill('');
            state.submitted = false;

            document.getElementById('quiz-area').style.display = 'block';
            document.getElementById('results-area').style.display = 'none';

            renderQuizQuestions();
            startTimer();
        }

        function changeSeries() {
            document.getElementById('seriesSelector').style.display = 'grid';
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('results-area').style.display = 'none';
            renderSeriesSelector();
        }

        // ============ PRINT MODE — SERIES SELECTION ============
        let selectedSeries = new Set([1, 2, 3, 4, 5, 6, 7, 8]);

        function toggleSeriesChip(btn) {
            const series = btn.dataset.series;

            if (series === 'all') {
                const allActive = btn.classList.contains('active');
                const chips = document.querySelectorAll('.series-chip');
                if (allActive) {
                    // Deselect all
                    chips.forEach(c => c.classList.remove('active'));
                    selectedSeries.clear();
                } else {
                    // Select all
                    chips.forEach(c => c.classList.add('active'));
                    selectedSeries = new Set([1, 2, 3, 4, 5, 6, 7, 8]);
                }
            } else {
                const num = parseInt(series);
                btn.classList.toggle('active');
                if (selectedSeries.has(num)) {
                    selectedSeries.delete(num);
                } else {
                    selectedSeries.add(num);
                }
                // Update "Toutes" chip
                const allChip = document.querySelector('.series-chip[data-series="all"]');
                if (selectedSeries.size === 8) {
                    allChip.classList.add('active');
                } else {
                    allChip.classList.remove('active');
                }
            }
            generatePrintSheets();
        }

        const SERIES_TITLES = [
            'Série 1 — Rendre la monnaie',
            'Série 2 — Additions de prix',
            'Série 3 — Prix × quantité',
            'Série 4 — Partager l\'addition',
            'Série 5 — Les bonnes affaires : pourcentages',
            'Série 6 — Prix à l\'unité',
            'Série 7 — Fractions de prix',
            'Série 8 — Le mix final (synthèse)'
        ];

        // Store generated questions for PDF
        let printQuestionsData = [];

        function generatePrintSheets() {
            printQuestionsData = [];
            const container = document.getElementById('print-series-container');
            const teacherContainer = document.getElementById('print-teacher-section');

            const seriesToGenerate = selectedSeries.size > 0 ? [...selectedSeries].sort((a, b) => a - b) : [1, 2, 3, 4, 5, 6, 7, 8];

            let seriesHtml = '';
            for (const s of seriesToGenerate) {
                const questions = generateQuestions(s);
                printQuestionsData.push({ num: s, title: SERIES_TITLES[s - 1], questions });

                let questionsHtml = '';
                questions.forEach((q, idx) => {
                    questionsHtml += `<div class="question"><div class="question-text"><span class="question-number">${idx + 1}</span>${q.text}</div><div class="answer-box"></div></div>`;
                });

                seriesHtml += `
                    <div class="series">
                        <div class="series-header">
                            <div class="series-title">${SERIES_TITLES[s - 1]}</div>
                            <div class="series-timer">3 minutes</div>
                        </div>
                        <div class="questions-grid">${questionsHtml}</div>
                        <div class="series-footer">
                            <span></span>
                            <div class="score-box">Score : ____ / 15</div>
                        </div>
                    </div>`;
            }
            container.innerHTML = seriesHtml;

            // Generate teacher section (HTML preview)
            let teacherHtml = `
                <div class="teacher-title">Fiche Enseignant — Réponses</div>
                <table class="answers-table">
                    <thead><tr>${printQuestionsData.map(s => `<th>Série ${s.num}</th>`).join('')}</tr></thead>
                    <tbody>`;
            for (let q = 0; q < 15; q++) {
                teacherHtml += '<tr>';
                for (const s of printQuestionsData) {
                    teacherHtml += `<td><span class="question-number">${q + 1}</span>${s.questions[q].answer}</td>`;
                }
                teacherHtml += '</tr>';
            }
            teacherHtml += '</tbody></table>';
            teacherContainer.innerHTML = teacherHtml;
        }

        // ============ PDF GENERATION (jsPDF) ============
        function downloadStudentPDF() {
            if (printQuestionsData.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            const pageW = 210, pageH = 297;
            const m = 10; // margin
            const usableW = pageW - 2 * m;
            const colW = usableW / 3;
            const rowH = 16;
            const seriesH = 10 + 5 * rowH + 8; // title bar + grid + score

            let y = m;

            // === Header (first page) ===
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.setTextColor(30, 64, 175);
            doc.text('Calcul Mental \u2014 Prix (6e)', m, y + 7);
            y += 13;

            doc.setFontSize(10);
            doc.setTextColor(60, 60, 60);
            doc.setFont('helvetica', 'normal');
            const fw = usableW / 3;
            doc.text('Nom :', m, y + 4);
            doc.setDrawColor(150); doc.setLineWidth(0.3);
            doc.line(m + 12, y + 5, m + fw - 3, y + 5);
            doc.text('Classe :', m + fw, y + 4);
            doc.line(m + fw + 15, y + 5, m + 2 * fw - 3, y + 5);
            doc.text('Date :', m + 2 * fw, y + 4);
            doc.line(m + 2 * fw + 12, y + 5, m + 3 * fw, y + 5);
            y += 10;

            doc.setDrawColor(30, 64, 175); doc.setLineWidth(0.6);
            doc.line(m, y, m + usableW, y);
            y += 6;

            // === Each series ===
            for (let si = 0; si < printQuestionsData.length; si++) {
                const s = printQuestionsData[si];

                // New page if needed
                if (y + seriesH > pageH - m) {
                    doc.addPage();
                    y = m;
                }

                // Title bar
                doc.setFillColor(30, 64, 175);
                doc.rect(m, y, usableW, 8, 'F');
                doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(255, 255, 255);
                doc.text(s.title, m + 3, y + 5.5);
                doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
                doc.text('3 minutes', m + usableW - 22, y + 5.5);
                y += 10;

                // Questions grid (3 cols × 5 rows)
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 3; col++) {
                        const qIdx = row * 3 + col;
                        const q = s.questions[qIdx];
                        const cx = m + col * colW;
                        const cy = y + row * rowH;

                        // Cell border
                        doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.2);
                        doc.rect(cx, cy, colW, rowH - 1);

                        // Number badge
                        doc.setFillColor(30, 64, 175);
                        doc.rect(cx + 2, cy + 2, 6, 4.5, 'F');
                        doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(255, 255, 255);
                        doc.text(String(qIdx + 1), cx + 5, cy + 5.2, { align: 'center' });

                        // Question text
                        doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(30, 30, 30);
                        const maxTxtW = colW - 16;
                        const lines = doc.splitTextToSize(q.text, maxTxtW);
                        doc.text(lines, cx + 10, cy + 4.5);

                        // Answer box
                        doc.setDrawColor(120, 120, 120); doc.setLineWidth(0.3);
                        doc.rect(cx + colW - 14, cy + rowH - 7, 12, 5);
                    }
                }
                y += 5 * rowH;

                // Score box
                doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(60, 60, 60);
                doc.text('Score : ____ / 15', m + usableW - 35, y + 3);
                y += 8;
            }

            doc.save('calcul-mental-prix-eleves.pdf');
        }

        function downloadTeacherPDF() {
            if (printQuestionsData.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            const pageW = 210, pageH = 297;
            const m = 10;
            const usableW = pageW - 2 * m;
            let y = m;

            // Title
            doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(30, 64, 175);
            doc.text('Fiche Enseignant \u2014 R\u00e9ponses', m, y + 7);
            y += 12;
            doc.setDrawColor(30, 64, 175); doc.setLineWidth(0.6);
            doc.line(m, y, m + usableW, y);
            y += 6;

            // Objectives block
            y = drawInfoBlock(doc, m, y, usableW, 'Objectifs p\u00e9dagogiques (Programme 2025)',
                [
                    'Automatismes : Effectuer 15 op\u00e9rations en 3 minutes sur le th\u00e8me des prix.',
                    'Cette ressource entra\u00eene les \u00e9l\u00e8ves \u00e0 d\u00e9velopper un calcul mental fluide et automatis\u00e9 en contexte significatif (prix, monnaie, r\u00e9ductions).'
                ], [224, 231, 255], [30, 64, 175]);

            // Advice block
            y = drawInfoBlock(doc, m, y, usableW, 'Conseils de passation',
                [
                    'Lecture : Lisez les questions \u00e0 haute voix ou laissez les \u00e9l\u00e8ves lire silencieusement.',
                    'Timing : 3 minutes strictes par s\u00e9rie. Utilisez un minuteur visible.',
                    'Format r\u00e9ponse : Les \u00e9l\u00e8ves \u00e9crivent uniquement le r\u00e9sultat.',
                    'Correction imm\u00e9diate : Corriger \u00e0 chaud pour un feedback optimal.',
                    'Progression : S\u00e9ries 1-2 en d\u00e9but d\'ann\u00e9e. S\u00e9ries 7-8 en fin d\'ann\u00e9e.',
                    'Fr\u00e9quence : 1-2 s\u00e9ries par semaine en ouverture de cours (5-10 min).'
                ], [254, 243, 199], [180, 83, 9]);

            // Strategies block
            y = drawInfoBlock(doc, m, y, usableW, 'Strat\u00e9gies mentales \u00e0 enseigner',
                [
                    'Compl\u00e9ments : Rendre la monnaie en passant par la dizaine.',
                    'Pourcentages courants : 10% = \u00f710 ; 50% = \u00f72 ; 25% = \u00f74 ; 20% = \u00f75.',
                    'Multiplication par d\u00e9composition : 7 \u00d7 1,50 = 7 + 3,50 = 10,50.',
                    'Prix \u00e0 l\'unit\u00e9 : total \u00f7 quantit\u00e9.',
                    'Fractions : 1/2 = 0,5 ; 1/4 = 0,25.',
                    'Doubles et moiti\u00e9s : Cas particuliers \u00e0 conna\u00eetre par automatisme.'
                ], [220, 252, 231], [22, 163, 74]);

            // New page for answer table
            doc.addPage();
            y = m;

            doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(30, 64, 175);
            doc.text('Tableau des r\u00e9ponses', m, y + 6);
            y += 12;

            // Answer table
            const nbSeries = printQuestionsData.length;
            const colW = usableW / nbSeries;
            const rowH = 8;

            // Header row
            doc.setFillColor(30, 64, 175);
            doc.rect(m, y, usableW, rowH, 'F');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(255, 255, 255);
            for (let c = 0; c < nbSeries; c++) {
                doc.text('S\u00e9rie ' + printQuestionsData[c].num, m + c * colW + colW / 2, y + 5.5, { align: 'center' });
            }
            y += rowH;

            // Data rows
            for (let q = 0; q < 15; q++) {
                if (q % 2 === 0) {
                    doc.setFillColor(245, 245, 250);
                    doc.rect(m, y, usableW, rowH, 'F');
                }

                doc.setDrawColor(220, 220, 220); doc.setLineWidth(0.1);
                doc.line(m, y + rowH, m + usableW, y + rowH);

                for (let c = 0; c < nbSeries; c++) {
                    // Badge
                    doc.setFillColor(30, 64, 175);
                    doc.rect(m + c * colW + 2, y + 1.5, 5, 4, 'F');
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(6.5); doc.setTextColor(255, 255, 255);
                    doc.text(String(q + 1), m + c * colW + 4.5, y + 4.3, { align: 'center' });

                    // Answer
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(30, 30, 30);
                    doc.text(printQuestionsData[c].questions[q].answer, m + c * colW + 9, y + 5.5);

                    // Column divider
                    if (c > 0) {
                        doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.1);
                        doc.line(m + c * colW, y, m + c * colW, y + rowH);
                    }
                }
                y += rowH;
            }

            // Table border
            doc.setDrawColor(30, 64, 175); doc.setLineWidth(0.4);
            doc.rect(m, m + 12, usableW, rowH + 15 * rowH);

            doc.save('calcul-mental-prix-enseignant.pdf');
        }

        function drawInfoBlock(doc, x, y, w, title, items, bgColor, accentColor) {
            const lineH = 5;
            const blockH = 7 + items.length * lineH + 3;

            // Background
            doc.setFillColor(bgColor[0], bgColor[1], bgColor[2]);
            doc.rect(x, y, w, blockH, 'F');
            // Left accent bar
            doc.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
            doc.rect(x, y, 1.5, blockH, 'F');

            // Title
            doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
            doc.setTextColor(accentColor[0], accentColor[1], accentColor[2]);
            doc.text(title, x + 5, y + 5);

            // Items
            doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5);
            doc.setTextColor(50, 50, 50);
            items.forEach((item, i) => {
                doc.text('\u2022 ' + item, x + 5, y + 10 + i * lineH);
            });

            return y + blockH + 4;
        }

        // ============ TEACHER DASHBOARD ============
        function refreshDashboard() {
            const allStudents = getAllStudents();
            const tbody = document.getElementById('dashboardBody');

            const rows = Object.entries(allStudents).map(([name, data]) => {
                const cells = [name];
                for (let series = 1; series <= 8; series++) {
                    const bestScore = data.bestScores[series];
                    let cellClass = '';
                    if (bestScore !== undefined) {
                        if (bestScore >= 12) cellClass = 'green';
                        else if (bestScore >= 8) cellClass = 'orange';
                        else cellClass = 'red';
                        cells.push(`<span class="score-cell ${cellClass}">${bestScore}</span>`);
                    } else {
                        cells.push('-');
                    }
                }
                cells.push(data.attempts.length);
                return `<tr>${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
            }).join('');

            tbody.innerHTML = rows;
        }

        function exportCSV() {
            const allStudents = getAllStudents();
            const rows = [['Élève', 'Série', 'Meilleur score', 'Tentatives', 'Dernière date']];

            Object.entries(allStudents).forEach(([name, data]) => {
                for (let series = 1; series <= 8; series++) {
                    const bestScore = data.bestScores[series] || '-';
                    const attempts = data.attempts.filter(a => a.series === series).length;
                    const lastAttempt = data.attempts.filter(a => a.series === series).pop();
                    const lastDate = lastAttempt ? lastAttempt.date : '-';
                    rows.push([name, `Série ${series}`, bestScore, attempts, lastDate]);
                }
            });

            const csv = rows.map(r => r.join(',')).join('\n');
            const link = document.createElement('a');
            link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            link.download = 'suivi_calcul_mental.csv';
            link.click();
        }

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', generatePrintSheets);
    </script>
</body>
